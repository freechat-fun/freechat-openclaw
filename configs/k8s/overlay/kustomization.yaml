# Kustomize overlay for the freechat-openclaw private deployment.
#
# namePrefix: freechat- rewrites every resource name to match the legacy Helm
# release (Deployment/Service/Ingress `openclaw` -> `freechat-openclaw`,
# ConfigMap `openclaw-config` -> `freechat-openclaw-config`) and auto-updates
# cross-references (Deployment config-volume ConfigMap ref, Ingress backend
# Service ref). The data PVC `freechat-openclaw` is applied standalone by
# scripts/install.sh (not via Kustomize) so it is not prefixed -- it already
# matches the legacy name and preserves existing data.
#
# References the vendored official base (configs/k8s/base). The base's
# kustomization.yaml EXCLUDES pvc.yaml (local customization) so Kustomize does
# not create/adopt openclaw-home-pvc; the Deployment mounts the existing data
# PVC `freechat-openclaw` instead (claimName in deployment-patch.yaml), and
# scripts/install.sh creates that PVC only if missing (pvc.yaml, applied
# outside Kustomize).
#
# Patches:
#   - openclaw-config-cm.yaml : TRACKED, NON-SENSITIVE PLACEHOLDER. Sets
#                               data.openclaw.json to "{}" (preserves base
#                               data.AGENTS.md). The real config is gitignored
#                               at openclaw.json; prepare_overlay's wrapper
#                               injects a temp patch with it ON TOP of this
#                               placeholder, so the real config overrides "{}"
#                               at apply/render time. Edit openclaw.json, not
#                               the placeholder content (keep it "{}").
#   - deployment-patch.yaml   : image fallback, chromium sidecar, voice port,
#                               envFrom, init-config overwrite, claimName.
#   - service-patch.yaml      : voice:3334 service port.
#
# The temp wrapper generated by scripts/setenv.sh (prepare_overlay) adds the
# `images:` transformer with tags from configs/k8s/deploy.env on top of this,
# and injects the real openclaw.json as a temp patch overriding the placeholder
# (see merge_openclaw_config).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: freechat-
resources:
  - ../base
  - ingress.yaml
patches:
  - path: openclaw-config-cm.yaml
  - path: deployment-patch.yaml
  - path: service-patch.yaml
