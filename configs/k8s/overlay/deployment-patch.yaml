# Strategic-merge patch on Deployment/openclaw (base).
#
# Data preservation (legacy deployment reused its PVC `freechat-openclaw`):
# - Patch the openclaw-home volume -> claimName: freechat-openclaw (the
#   existing data PVC; it carries `helm.sh/resource-policy: keep` and survives
#   `helm uninstall`). The base's own openclaw-home-pvc is NOT created (see
#   overlay/kustomization.yaml -- base pvc.yaml is excluded); install.sh
#   creates freechat-openclaw only if it is missing.
# - init-config: overwrite /home/node/.openclaw/openclaw.json from the
#   ConfigMap each start (matches legacy CONFIG_MODE=overwrite; runtime state
#   like paired devices lives in SQLite on the PVC, untouched). AGENTS.md is
#   seeded only if missing so any existing on-PVC copy is preserved.
#
# - Gateway image tag is a fallback default only; the actual tag is set from
#   OPENCLAW_IMAGE in configs/k8s/deploy.env via a Kustomize `images:`
#   transformer at apply/render time (scripts/setenv.sh :: prepare_overlay).
# - Add voice containerPort 3334 (voice-call webhook) + envFrom: openclaw-secrets.
# - The chromium sidecar now lives in base/deployment.yaml as a NATIVE sidecar
#   (initContainers + restartPolicy: Always, CDP on 9222, XDG_CACHE_HOME=/tmp,
#   startup/liveness/readiness probes on /json/version, /tmp-only mount,
#   non-root UID 1000, drop ALL, read-only root FS) and is no longer patched
#   here. Its image tag is still driven by CHROMIUM_IMAGE in deploy.env -- the
#   Kustomize images: transformer matches chromedp/headless-shell wherever it
#   is defined (base or overlay).
#
# The base security posture is preserved (fsGroup 1000, seccomp RuntimeDefault,
# automountServiceAccountToken false). The legacy privileged init-permissions
# container is intentionally NOT carried over -- fsGroup: 1000 handles PVC
# ownership per official guidance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  template:
    spec:
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          ports:
            - name: voice
              containerPort: 3334
              protocol: TCP
          envFrom:
            - secretRef:
                name: openclaw-secrets
          # command:
          #   - openclaw
          #   - doctor
          #   - --fix
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: freechat-openclaw
